<script>
// Restore the theme before CSS or external scripts can produce a default-color frame.
window.applyLedgerTheme=function(theme){
  const colors={forest:['#F4F6F5','#101612'],ocean:['#F3F7F8','#0E171B'],ink:['#F4F4F2','#101114'],berry:['#F6F3F5','#151017']};
  const value=Object.prototype.hasOwnProperty.call(colors,theme)?theme:'forest';
  document.documentElement.dataset.theme=value;
  if(document.body)document.body.dataset.theme=value;
  document.querySelectorAll('meta[name="theme-color"]').forEach(meta=>{
    meta.content=colors[value][meta.media.includes('dark')?1:0];
  });
  return value;
};
try{window.applyLedgerTheme(localStorage.getItem('ledger_theme'))}
catch(e){window.applyLedgerTheme('forest')}
</script>
<link rel="manifest" href="manifest.json?v=2">

<style>
:root {
  --primary: #3F7A58;
  --primary-light: #E8F2EC;
  --primary-dark: #2F5F43;
  --accent: #426D8F;
  --warm: #D79A2B;
  --bg: #F4F6F5;
  --card: #ffffff;
  --card-2: #F9FAF9;
  --text: #1E2233;
  --text2: #717988;
  --border: #E1E6E3;
  --danger: #D95858;
  --danger-soft: #FBEAEA;
  --radius: 8px;
  --shadow: 0 10px 24px rgba(31,45,36,0.07);
  --shadow-soft: 0 1px 2px rgba(31,45,36,0.05);
  --glass: rgba(255,255,255,.84);
  --button-shadow: 0 9px 18px rgba(31,45,36,.08);
  --primary-shadow: 0 10px 22px rgba(63,122,88,.24);
  --tab-height: 64px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101612;
    --card: #182019;
    --card-2: #111A14;
    --text: #EEF2EF;
    --text2: #A5B0A9;
    --border: #2B382E;
    --primary-light: #183325;
    --danger-soft: #3A1E1E;
    --shadow: 0 12px 28px rgba(0,0,0,0.28);
    --shadow-soft: 0 1px 2px rgba(0,0,0,0.24);
    --glass: rgba(24,32,25,.82);
    --button-shadow: 0 10px 20px rgba(0,0,0,.24);

  }
}
html[data-theme="ocean"]{--primary:#356E88;--primary-light:#E7F1F5;--primary-dark:#29566A;--accent:#4A7C59;--warm:#C9912C;--bg:#F3F7F8;--card:#FFFFFF;--card-2:#F7FAFB;--text:#172635;--text2:#687A86;--border:#DCE7EB;--shadow:0 12px 26px rgba(24,60,78,.08);--shadow-soft:0 1px 2px rgba(24,60,78,.05);--button-shadow:0 9px 18px rgba(24,60,78,.1);--primary-shadow:0 10px 22px rgba(53,110,136,.26)}
html[data-theme="ink"]{--primary:#4C5D73;--primary-light:#ECEFF3;--primary-dark:#334155;--accent:#3F7A58;--warm:#B77D2B;--bg:#F4F4F2;--card:#FFFFFF;--card-2:#F7F7F5;--text:#171A22;--text2:#6C7280;--border:#E0E1DF;--shadow:0 12px 26px rgba(24,26,34,.08);--shadow-soft:0 1px 2px rgba(24,26,34,.05);--button-shadow:0 9px 18px rgba(24,26,34,.1);--primary-shadow:0 10px 22px rgba(76,93,115,.26)}
html[data-theme="berry"]{--primary:#8A4963;--primary-light:#F5EAF0;--primary-dark:#6C344B;--accent:#356E88;--warm:#C9912C;--bg:#F6F3F5;--card:#FFFFFF;--card-2:#FAF7F9;--text:#211A20;--text2:#766B73;--border:#E8DDE4;--danger:#C95555;--danger-soft:#F9EAEA;--shadow:0 12px 26px rgba(75,34,55,.08);--shadow-soft:0 1px 2px rgba(75,34,55,.05);--button-shadow:0 9px 18px rgba(75,34,55,.1);--primary-shadow:0 10px 22px rgba(138,73,99,.26)}
@media (prefers-color-scheme: dark){
  html[data-theme="ocean"]{--primary:#78AFC5;--primary-light:#17303A;--primary-dark:#A9D1DF;--bg:#0E171B;--card:#162228;--card-2:#111D22;--text:#EAF2F5;--text2:#9FB3BD;--border:#283D45;--glass:rgba(22,34,40,.84);--primary-shadow:0 10px 22px rgba(120,175,197,.28)}
  html[data-theme="ink"]{--primary:#9AA7B8;--primary-light:#252B34;--primary-dark:#D0D7E0;--bg:#101114;--card:#191B20;--card-2:#121419;--text:#F1F2F4;--text2:#A8ADB6;--border:#2D3037;--glass:rgba(25,27,32,.84);--primary-shadow:0 10px 22px rgba(154,167,184,.24)}
  html[data-theme="berry"]{--primary:#D38AA8;--primary-light:#3A2230;--primary-dark:#F0B7CF;--bg:#151017;--card:#211822;--card-2:#181119;--text:#F6EEF3;--text2:#B9A7B2;--border:#3A2A35;--glass:rgba(33,24,34,.84);--primary-shadow:0 10px 22px rgba(211,138,168,.26)}
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;background:var(--bg);color:var(--text);padding-bottom:calc(var(--tab-height)+env(safe-area-inset-bottom));overflow-x:hidden;min-height:100vh}
.page{display:none;padding:18px 18px 110px;max-width:480px;margin:0 auto;animation:fadeIn .2s;min-height:100vh}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.page-title{font-size:30px;font-weight:800;margin-bottom:18px;padding-top:14px;line-height:1.05;letter-spacing:0}
.card,.stats-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.card-title{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:14px;text-transform:uppercase;letter-spacing:0}
.input-group{margin-bottom:15px}
.input-group label{display:block;font-size:13px;font-weight:700;color:var(--text2);margin-bottom:7px}
.input-group input,.input-group select,.input-group textarea{width:100%;padding:14px 15px;border:1px solid var(--border);border-radius:10px;font-size:17px;background:var(--card-2);color:var(--text);outline:none;transition:border .2s,background .2s,box-shadow .2s;-webkit-appearance:none;appearance:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.input-group input:focus,.input-group select:focus,.input-group textarea:focus{border-color:var(--primary);background:var(--card);box-shadow:0 0 0 4px var(--primary-light)}
.input-group textarea{resize:none;min-height:60px;font-family:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 18px;border:none;border-radius:10px;font-size:17px;font-weight:700;cursor:pointer;transition:transform .15s,opacity .15s,background .15s,box-shadow .15s;gap:6px;box-shadow:var(--button-shadow)}
.btn:active{opacity:.82;transform:translateY(1px) scale(.99);box-shadow:var(--shadow-soft)}
.btn-primary{background:var(--primary);color:#fff;width:100%;box-shadow:var(--primary-shadow)}
.btn-secondary{background:rgba(236,239,238,.86);color:var(--text);width:100%;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-sm{padding:8px 14px;font-size:14px}
.btn-icon{background:var(--card-2);border:1px solid var(--border);border-radius:8px;cursor:pointer;padding:6px 8px;color:var(--text2);font-size:15px;line-height:1}
.bottom-tabs{position:fixed;bottom:0;left:50%;right:auto;transform:translateX(-50%);width:100%;max-width:480px;height:calc(var(--tab-height)+env(safe-area-inset-bottom));background:var(--glass);border:1px solid var(--border);border-bottom:none;border-radius:18px 18px 0 0;display:flex;align-items:flex-start;padding-top:8px;z-index:100;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -14px 34px rgba(31,45,36,.11);backdrop-filter:blur(22px) saturate(1.25);-webkit-backdrop-filter:blur(22px) saturate(1.25)}
@media (prefers-color-scheme: dark){.bottom-tabs{background:rgba(24,32,25,.9)}}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 0;cursor:pointer;color:var(--text2);font-size:11px;font-weight:600;transition:color .15s;border:none;background:none;-webkit-tap-highlight-color:transparent}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--primary);font-weight:600}
.tab.active svg{stroke:var(--primary)}

/* Home page */
.home-summary{display:flex;gap:10px;margin-bottom:14px}
.summary-item{flex:1;background:var(--glass);border:1px solid var(--border);border-radius:var(--radius);padding:16px 12px;text-align:left;box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.summary-item .num{font-size:30px;font-weight:800;color:var(--primary);line-height:1}
.summary-item .label{font-size:12px;color:var(--text2);margin-top:7px;font-weight:700}

/* List page */
.list-date{font-size:12px;font-weight:700;color:var(--text2);margin:14px 0 7px;padding:0 4px}
.list-item{display:flex;align-items:center;padding:13px 0;border-bottom:1px solid var(--border);gap:10px}
.list-item:last-child{border:none}
.list-item .cat-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px var(--card-2)}
.list-item .info{flex:1;min-width:0}
.list-item .info .name{font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .info .meta{font-size:12px;color:var(--text2);margin-top:3px}
.list-item .amount{font-size:17px;font-weight:750;white-space:nowrap}
.list-item .actions{display:flex;gap:4px}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-bar input,.filter-bar select{flex:1;min-width:88px;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:15px;background:var(--card);color:var(--text);box-shadow:var(--shadow-soft)}

/* Stats page */
.chart-container{position:relative;width:100%;display:flex;justify-content:center;padding:4px 0}
#pieChart,#lineChart{max-width:100%;background:var(--card)}
.stats-cat-list{margin-top:12px}
.stats-cat-item{display:flex;align-items:center;padding:6px 0;gap:8px;font-size:13px}
.stats-cat-item .bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.stats-cat-item .bar-fill{height:100%;border-radius:3px;transition:width .3s}
.stats-cat-item .pct{width:40px;text-align:right;color:var(--text2)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(14,20,18,.48);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.modal-overlay.active{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto;animation:modalIn .2s;box-shadow:0 22px 60px rgba(0,0,0,.18)}
@keyframes modalIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{font-size:18px;margin-bottom:14px}
.modal .btn-row{display:flex;gap:8px;margin-top:12px}
.modal .btn-row .btn{flex:1}

/* Settings */
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border)}
.setting-row:last-child{border:none}
.setting-row[hidden]{display:none}
.setting-row .label{font-size:16px;font-weight:650;padding-right:12px;color:var(--text)}
.setting-row .btn{width:auto;min-width:78px;flex-shrink:0}
.theme-select{width:auto;min-width:118px;padding:9px 30px 9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card-2);color:var(--text);font-size:14px;font-weight:700;box-shadow:var(--button-shadow)}
.setting-row .hint{font-size:12px;color:var(--text2);margin-top:2px}
.shortcut-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.shortcut-btn{background:var(--card-2);border:1px solid var(--border);border-radius:10px;padding:13px;text-align:left;color:var(--text);cursor:pointer;box-shadow:var(--button-shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .15s,opacity .15s,box-shadow .15s}
.shortcut-btn:active{opacity:.82;transform:translateY(1px) scale(.99);box-shadow:var(--shadow-soft)}
.shortcut-btn .name{font-size:15px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shortcut-btn .meta{font-size:12px;color:var(--text2);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frequent-section{margin-bottom:18px}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.section-heading h2{font-size:15px;font-weight:700}
.text-action{border:0;background:none;color:var(--primary);font:inherit;font-size:14px;cursor:pointer;padding:8px 0}
.frequent-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.frequent-list .shortcut-btn{min-height:76px;border-radius:8px;box-shadow:var(--shadow-soft)}
.frequent-list .name,.frequent-list .meta{white-space:normal;overflow-wrap:anywhere}
#frequentManageList{max-height:48vh;max-height:48dvh;overflow-y:auto;overscroll-behavior:contain;padding:2px}
#frequentHomeList{max-height:264px;overflow-y:auto;overscroll-behavior:contain;padding:2px}
.form-columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-columns>*{min-width:0}
.status-line{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:12px;overflow-wrap:anywhere}
.rule-row{padding:14px 0;border-bottom:1px solid var(--border)}
.rule-heading{display:flex;justify-content:space-between;align-items:center;gap:12px}
.rule-heading strong{font-size:15px;overflow-wrap:anywhere;min-width:0}
.rule-actions{display:flex;align-items:center;justify-content:flex-end;gap:14px;margin-top:6px}
.rule-actions input{width:18px;height:18px;accent-color:var(--primary)}
.rule-actions label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--text2)}
button:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
@media(prefers-reduced-motion:reduce){.page,.modal{animation:none}.shortcut-btn{transition:none}}
.backup-status{font-size:13px;color:var(--text2);line-height:1.6;margin:2px 0 4px}
.backup-status.warning{color:#A76618}
/* Skeleton */
.skeleton{background:linear-gradient(90deg,var(--border) 25%,var(--card) 50%,var(--border) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

.alert-confirm{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.alert-confirm.active{display:flex}
.alert-box{background:var(--card);border-radius:14px;padding:20px;max-width:300px;text-align:center}
.alert-box p{margin-bottom:14px;font-size:15px}
.alert-box .btn-row{display:flex;gap:8px}
.alert-box .btn-row .btn{flex:1}
</style>
</head>
<body>

<!-- HOME -->
<div class="page active" id="page-home">
  <div class="page-title">记账</div>
  <div class="home-summary">
    <div class="summary-item"><div class="num" id="todayCount">0</div><div class="label">今日笔数</div></div>
    <div class="summary-item"><div class="num" id="todayTotal">0.00</div><div class="label">今日支出</div></div>
  </div>
  <section class="frequent-section" id="frequentSection" hidden>
    <div class="section-heading"><h2>常用账单</h2><button class="text-action" onclick="showFrequentManager()">全部</button></div>
    <div class="frequent-list" id="frequentHomeList"></div>
  </section>
  <div class="status-line" id="recurringStatus" role="status" hidden></div>
  <div class="card" id="shortcutCard" style="display:none">
    <div class="card-title">快捷账单</div>
    <div class="shortcut-grid" id="shortcutList"></div>
  </div>
  <div class="card">
    <div class="card-title">记一笔</div>
    <div class="input-group"><label for="inpName">支出名称</label><input type="text" id="inpName" placeholder="如：午饭" list="frequentNames" oninput="recognizeFrequentName()" autocomplete="off"><datalist id="frequentNames"></datalist></div>
    <div class="input-group"><label>金额</label><input type="number" id="inpAmount" placeholder="0.00" step="0.01" inputmode="decimal"></div>
    <div class="input-group"><label>分类</label><select id="inpCategory"></select></div>
    <div class="input-group"><label>账户</label><select id="inpAccount"></select></div>
    <div class="input-group"><label>日期</label><input type="date" id="inpDate"></div>
    <button class="btn btn-primary" onclick="addRecord()">保存</button>
  </div>
</div>

<!-- LIST -->
<div class="page" id="page-list">
  <div class="page-title">账单</div>
  <div class="filter-bar">
    <input id="searchInput" placeholder="搜索支出名称" oninput="renderList()">
    <select id="filterCategory" onchange="renderList()"><option value="">全部分类</option></select>
    <select id="filterAccount" onchange="renderList()" style="max-width:110px"><option value="">全部账户</option></select>
  </div>
  <div id="listContent"></div>
</div>

<!-- STATS -->
<div class="page" id="page-stats">
  <div class="page-title">统计</div>
  <div class="stats-card">
    <div class="card-title">本月支出</div>
    <div style="font-size:28px;font-weight:700;color:var(--primary);margin-bottom:12px" id="monthTotal">0.00</div>
    <div class="chart-container" id="chartContainer"></div>
    <div id="pieLegend" class="stats-cat-list"></div>
  </div>
  <div class="stats-card">
    <div class="card-title">按日趋势</div>
    <div class="chart-container" id="lineContainer"></div>
  </div>
</div>

<!-- ANALYSIS -->
<div class="page" id="page-analysis">
  <div class="page-title">分析</div>
  <div class="card">
    <div class="card-title">按分类查询</div>
    <div class="input-group"><label>分类</label><select id="analysisCategory" onchange="runAnalysis()"></select></div>
    <div style="display:flex;gap:6px">
      <div class="input-group" style="flex:1;min-width:0"><label>开始</label><input type="date" id="analysisDateStart" onchange="runAnalysis()" style="font-size:14px;padding:10px 8px;min-width:0;width:100%"></div>
      <div class="input-group" style="flex:1;min-width:0"><label>结束</label><input type="date" id="analysisDateEnd" onchange="runAnalysis()" style="font-size:14px;padding:10px 8px;min-width:0;width:100%"></div>
    </div>
    <div id="analysisResult" style="margin-top:12px"></div>
  </div>
  <div class="card">
    <div class="card-title">快捷查询</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">
      <button class="btn btn-sm btn-secondary" onclick="quickAnalysis('today')" style="flex:1;min-width:70px">今天</button>
      <button class="btn btn-sm btn-secondary" onclick="quickAnalysis('yesterday')" style="flex:1;min-width:70px">昨天</button>
      <button class="btn btn-sm btn-secondary" onclick="quickAnalysis('week')" style="flex:1;min-width:70px">本周</button>
      <button class="btn btn-sm btn-secondary" onclick="quickAnalysis('lastweek')" style="flex:1;min-width:70px">上周</button>
      <button class="btn btn-sm btn-secondary" onclick="quickAnalysis('lastmonth')" style="flex:1;min-width:70px">上月</button>
    </div>
  </div>
</div>

<!-- SETTINGS -->
<div class="page" id="page-settings">
  <div class="page-title">设置</div>
  <div class="card">
    <div class="setting-row"><span class="label">界面主题</span><select id="themeSelect" class="theme-select" onchange="changeTheme()"><option value="forest">松林</option><option value="ocean">海雾</option><option value="ink">墨灰</option><option value="berry">莓酒</option></select></div>
    <div class="setting-row"><span class="label">分类管理</span><button class="btn btn-sm btn-secondary" onclick="showCategoryManager()">管理</button></div>
    <div class="setting-row"><span class="label">快捷账单</span><button class="btn btn-sm btn-secondary" onclick="showShortcutManager()">管理</button></div>
    <div class="setting-row"><span class="label">常用账单</span><button class="btn btn-sm btn-secondary" onclick="showFrequentManager()">查看</button></div>
    <div class="setting-row"><span class="label">统一历史账单名称</span><button class="btn btn-sm btn-secondary" onclick="normalizeHistoricalNames()">整理</button></div>
    <div class="setting-row" id="nameBackupRow" hidden><span class="label">名称整理前备份</span><button class="btn btn-sm btn-secondary" onclick="downloadNameBackup()">导出</button></div>
    <div class="setting-row"><span class="label">每月固定账单</span><button class="btn btn-sm btn-secondary" onclick="showRecurringManager()">管理</button></div>
    <div class="setting-row"><span class="label">导出 CSV</span><button class="btn btn-sm btn-secondary" onclick="exportCSV()">导出</button></div>

<script src="bill-tools.js"></script>
<script>
// ====== DATA ======
const STORAGE_RECORDS = 'ledger_records';
const STORAGE_CATS = 'ledger_categories';
const STORAGE_ACCOUNTS = 'ledger_accounts';
const STORAGE_SHORTCUTS = 'ledger_shortcuts';
const STORAGE_RECURRING = 'ledger_recurring';
const STORAGE_FREQUENT = 'ledger_frequent_templates';
const STORAGE_NAME_BACKUP = 'ledger_before_name_cleanup';
const STORAGE_BACKUP_AT = 'ledger_last_backup_at';
const STORAGE_BACKUP_SIGNATURE = 'ledger_last_backup_signature';
const STORAGE_THEME = 'ledger_theme';
const DEFAULT_CATS = ['餐饮','App订阅','日用','交通','学习','游戏','娱乐活动','AI','电子产品及配件','家庭开销','人情世故','恋爱支出','医疗健体'];
const DEFAULT_ACCOUNTS = ['微信支付','支付宝','银行卡','亲情卡'];

function readJSON(key,fallback){
  try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))}
  catch(e){return fallback}
}
function getRecords(){return readJSON(STORAGE_RECORDS,[])}
function saveRecords(r){localStorage.setItem(STORAGE_RECORDS,JSON.stringify(r))}
function getCategories(){return readJSON(STORAGE_CATS,DEFAULT_CATS)}
function saveCategories(c){localStorage.setItem(STORAGE_CATS,JSON.stringify(c))}
function getAccounts(){return readJSON(STORAGE_ACCOUNTS,DEFAULT_ACCOUNTS)}
function saveAccounts(a){localStorage.setItem(STORAGE_ACCOUNTS,JSON.stringify(a))}
function getShortcuts(){return readJSON(STORAGE_SHORTCUTS,[])}
function saveShortcuts(s){localStorage.setItem(STORAGE_SHORTCUTS,JSON.stringify(s))}
function getRecurring(){return readJSON(STORAGE_RECURRING,[])}
function saveRecurring(r){localStorage.setItem(STORAGE_RECURRING,JSON.stringify(r))}
function getFrequentTemplates(){return readJSON(STORAGE_FREQUENT,[])}
function getTheme(){return localStorage.getItem(STORAGE_THEME)||'forest'}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){return toDateStr(new Date())}
function now(){const d=new Date();return d.toTimeString().slice(0,5)}

// ====== INIT ======
initStorage();
applyTheme(getTheme());
setTimeout(function(){document.getElementById('inpDate').value=today();},50);
populateCategorySelects();

function initStorage(){
  if(localStorage.getItem(STORAGE_CATS)===null) saveCategories(DEFAULT_CATS);
  if(localStorage.getItem(STORAGE_ACCOUNTS)===null) saveAccounts(DEFAULT_ACCOUNTS);
  if(localStorage.getItem(STORAGE_SHORTCUTS)===null) saveShortcuts([]);
}

function applyTheme(theme){
  const value=window.applyLedgerTheme(theme);
  localStorage.setItem(STORAGE_THEME,value);
  const sel=document.getElementById('themeSelect');
  if(sel)sel.value=value;
}

function changeTheme(){
  applyTheme(document.getElementById('themeSelect').value);
}

function populateCategorySelects(){
  const cats=getCategories();
  const accts=getAccounts();
  ['inpCategory','editCategory','filterCategory','shortcutCategory','recurringCategory'].forEach(id=>{
    const sel=document.getElementById(id);
    if(!sel) return;
    if(id==='filterCategory') sel.innerHTML='<option value="">全部分类</option>';
    else sel.innerHTML='';
    cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o)});
  });
  ['inpAccount','editAccount','filterAccount','shortcutAccount','recurringAccount'].forEach(id=>{
    const sel=document.getElementById(id);
    if(!sel) return;
    sel.innerHTML='';
    if(id==='filterAccount'){const o=document.createElement('option');o.value='';o.textContent='全部账户';sel.appendChild(o)}
    accts.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o)});
  });
}

function populateAccountSelects(){}

// ====== TAB SWITCH ======
function switchTab(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.querySelector('.tab[data-tab="'+name+'"]').classList.add('active');
  if(name==='home') refreshHome();
  if(name==='list') renderList();
  if(name==='stats') renderStats();
  if(name==='analysis') initAnalysis()
  if(name==='settings') renderBackupStatus()
}

// ====== HOME ======
function refreshHome(){
  const records=getRecords();
  const d=today();
  const todayRecs=records.filter(r=>r.date===d);
  document.getElementById('todayCount').textContent=todayRecs.length;
  document.getElementById('todayTotal').textContent=todayRecs.reduce((s,r)=>s+r.amount,0).toFixed(2);
  renderShortcuts();
  renderFrequentHome();
}

// Common bills only fill the form; the existing fixed-price shortcuts still record immediately.
function commonBills(){
  const local=BillTools.frequent(getRecords());
  const saved=BillTools.mergeTemplates(getFrequentTemplates());
  const templates=new Map(saved.map(r=>[BillTools.nameKey(r.name),r]));
  local.forEach(r=>{const previous=templates.get(BillTools.nameKey(r.name));if(previous)r.count=Math.max(r.count,previous.count)});
  const keys=new Set(local.map(r=>BillTools.nameKey(r.name)));
  return local.concat(saved.filter(r=>!keys.has(BillTools.nameKey(r.name))))
    .sort((a,b)=>b.count-a.count||String(b.last).localeCompare(String(a.last)));
}
function frequentButtons(el,items){
  el.replaceChildren();
  items.forEach(item=>{
    const button=document.createElement('button');button.className='shortcut-btn';
    const name=document.createElement('div');name.className='name';name.textContent=item.name;
    const meta=document.createElement('div');meta.className='meta';meta.textContent=item.category+' · '+item.count+' 次';
    button.append(name,meta);button.onclick=()=>fillFrequent(item);el.appendChild(button);
  });
}
function renderFrequentHome(){
  const items=commonBills();
  document.getElementById('frequentSection').hidden=!items.length;
  frequentButtons(document.getElementById('frequentHomeList'),items);
  const list=document.getElementById('frequentNames');list.replaceChildren();
  items.forEach(item=>{const option=document.createElement('option');option.value=item.name;list.appendChild(option)});
}
function selectKnownOption(id,value){
  if(!value)return;
  const select=document.getElementById(id);
  if(!Array.from(select.options).some(o=>o.value===value)){
    const option=document.createElement('option');option.value=value;option.textContent=value;select.appendChild(option);
  }
  select.value=value;
}
function fillFrequent(item){
  closeFrequentModal();switchTab('home');
  document.getElementById('inpName').value=item.name;
  document.getElementById('inpAmount').value=Number(item.amount).toFixed(2);
  document.getElementById('inpDate').value=today();
  selectKnownOption('inpCategory',item.category);selectKnownOption('inpAccount',item.account);
  const input=document.getElementById('inpAmount');input.focus();input.select();
}
function recognizeFrequentName(){
  const key=BillTools.nameKey(document.getElementById('inpName').value);
  const item=commonBills().find(r=>BillTools.nameKey(r.name)===key);
  if(item){selectKnownOption('inpCategory',item.category);selectKnownOption('inpAccount',item.account)}
}
function showFrequentManager(){
  document.getElementById('frequentSearch').value='';renderFrequentManager();
  document.getElementById('frequentModal').classList.add('active');
}
function closeFrequentModal(){document.getElementById('frequentModal').classList.remove('active')}
function renderFrequentManager(){
  const all=commonBills(),key=BillTools.nameKey(document.getElementById('frequentSearch').value);
  const items=all.filter(r=>BillTools.nameKey(r.name).includes(key));
  document.getElementById('frequentSummary').textContent=all.length?'共 '+all.length+' 个项目':'暂无账单项目';
  frequentButtons(document.getElementById('frequentManageList'),items);
}
async function importFrequentFile(event){
  const file=event.target.files[0];event.target.value='';if(!file)return;
  try{
    const rows=BillTools.parseMarkdown(await file.text());
    const templates=BillTools.frequent(rows);
    if(!templates.length){alert('没有找到账单项目，请选择应用导出的 Obsidian 流水 MD');return}
    const merged=new Map(getFrequentTemplates().map(r=>[BillTools.nameKey(r.name),r]));
    templates.forEach(r=>merged.set(BillTools.nameKey(r.name),r));
    localStorage.setItem(STORAGE_FREQUENT,JSON.stringify([...merged.values()]));
    renderFrequentHome();renderFrequentManager();renderBackupStatus();
    alert('已提取 '+templates.length+' 个常用项目，未导入历史账单');
  }catch(e){alert('提取失败：'+e.message)}
}

function normalizeHistoricalNames(){
  const records=getRecords(),normalized=BillTools.normalizeRecords(records);
  const changes=records.map((r,i)=>({before:r.name,after:normalized[i].name})).filter(r=>r.before!==r.after);
  if(!changes.length){alert('当前名称已统一，无需修改');return}
  const examples=[...new Set(changes.map(r=>r.before+' → '+r.after))].slice(0,6).join('\n');
  showConfirm('将统一 '+changes.length+' 笔账单的名称，不删除或合并记录。原名称保存在备注，整理前自动保留完整备份。\n\n'+examples,()=>{
    try{
      localStorage.setItem(STORAGE_NAME_BACKUP,JSON.stringify(createBackup()));
      saveRecords(normalized);refreshHome();renderList();renderBackupStatus();
      alert('已统一 '+changes.length+' 笔名称，账单数量与金额不变');
    }catch(e){alert('整理失败，请检查存储空间。未能保存备份时不会修改账单。')}
  });
}
function downloadNameBackup(){
  const data=localStorage.getItem(STORAGE_NAME_BACKUP);
  if(data)downloadFile('ledger_before_name_cleanup.json',data,'application/json;charset=utf-8');
}

let editingRecurringId=null;
function clearRecurringForm(){
  editingRecurringId=null;
  ['recurringName','recurringAmount','recurringNote'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('recurringDay').value=new Date().getDate();
  document.getElementById('recurringStart').value=today();
  document.getElementById('recurringSave').textContent='添加固定账单';
  document.getElementById('recurringCancelEdit').hidden=true;
}
function showRecurringManager(){
  populateCategorySelects();clearRecurringForm();renderRecurringManager();
  document.getElementById('recurringModal').classList.add('active');
}
function closeRecurringModal(){document.getElementById('recurringModal').classList.remove('active')}
function renderRecurringManager(){
  const list=document.getElementById('recurringManageList');list.replaceChildren();
  if(!getRecurring().length){list.textContent='暂无固定账单';list.className='status-line';return}
  list.className='';
  getRecurring().forEach(rule=>{
    const row=document.createElement('div');row.className='rule-row';
    const heading=document.createElement('div');heading.className='rule-heading';
    const name=document.createElement('strong');name.textContent=rule.name;
    const price=document.createElement('span');price.textContent='¥'+Number(rule.amount).toFixed(2);heading.append(name,price);
    const meta=document.createElement('div');meta.className='status-line';meta.style.marginBottom='0';
    meta.textContent='每月 '+rule.day+' 日 · '+rule.category+' · '+rule.account+' · '+(rule.enabled?'下次 '+rule.nextDate:'已暂停');
    const actions=document.createElement('div');actions.className='rule-actions';
    const label=document.createElement('label'),toggle=document.createElement('input');toggle.type='checkbox';toggle.checked=rule.enabled;
    toggle.onchange=()=>toggleRecurring(rule.id,toggle.checked);label.append(toggle,document.createTextNode('启用'));
    const edit=document.createElement('button');edit.className='text-action';edit.textContent='编辑';edit.onclick=()=>editRecurring(rule.id);
    const remove=document.createElement('button');remove.className='text-action';remove.style.color='var(--danger)';remove.textContent='删除';remove.onclick=()=>removeRecurring(rule.id);
    actions.append(label,edit,remove);row.append(heading,meta,actions);list.appendChild(row);
  });
}
function saveRecurringRule(){
  const rules=getRecurring(),previous=rules.find(r=>r.id===editingRecurringId);
  const startDate=document.getElementById('recurringStart').value,day=Number(document.getElementById('recurringDay').value);
  if(!BillTools.validDate(startDate)||!Number.isInteger(day)||day<1||day>31){alert('请输入有效的开始日期和扣款日');return}
  const rule={id:editingRecurringId||genId(),name:document.getElementById('recurringName').value.trim(),
    amount:Number(document.getElementById('recurringAmount').value),day,startDate,
    category:document.getElementById('recurringCategory').value,account:document.getElementById('recurringAccount').value,
    note:document.getElementById('recurringNote').value.trim(),enabled:previous?previous.enabled:true,
    nextDate:previous&&previous.day===day&&previous.startDate===startDate?previous.nextDate:BillTools.firstDue(startDate,day)};
  if(previous&&rule.nextDate.slice(0,7)<previous.nextDate.slice(0,7)){
    rule.nextDate=BillTools.firstDue(previous.nextDate.slice(0,7)+'-01',day);
  }
  if(!BillTools.validRule(rule)){alert('请填写名称、有效金额、分类和账户');return}
  const persist=()=>{
    if(previous)rules[rules.indexOf(previous)]=rule;else rules.push(rule);
    saveRecurring(rules);clearRecurringForm();checkRecurring();renderRecurringManager();renderBackupStatus();
  };
  if(rule.nextDate<=today()&&rule.enabled)showConfirm('将补记从 '+rule.nextDate+' 起到今天的到期账单（仅记账，不实际扣款），确定？',persist);
  else persist();
}
function editRecurring(id){
  const rule=getRecurring().find(r=>r.id===id);if(!rule)return;
  editingRecurringId=id;
  Object.entries({recurringName:rule.name,recurringAmount:rule.amount,recurringDay:rule.day,recurringStart:rule.startDate,recurringNote:rule.note||''})
    .forEach(([key,value])=>document.getElementById(key).value=value);
  selectKnownOption('recurringCategory',rule.category);selectKnownOption('recurringAccount',rule.account);
  document.getElementById('recurringSave').textContent='保存修改';document.getElementById('recurringCancelEdit').hidden=false;
  document.getElementById('recurringName').focus();
}
function toggleRecurring(id,enabled){
  const rules=getRecurring(),rule=rules.find(r=>r.id===id);if(!rule)return;
  rule.enabled=enabled;
  if(enabled)rule.nextDate=BillTools.firstDue(today()>rule.startDate?today():rule.startDate,rule.day);
  saveRecurring(rules);checkRecurring();renderRecurringManager();renderBackupStatus();
}
function removeRecurring(id){
  showConfirm('删除这项固定账单？已生成的历史账单会保留。',()=>{
    saveRecurring(getRecurring().filter(r=>r.id!==id));
    if(editingRecurringId===id)clearRecurringForm();renderRecurringManager();renderBackupStatus();
  });
}
function checkRecurring(){
  const status=document.getElementById('recurringStatus');
  try{
    const rules=getRecurring(),result=BillTools.collectDue(rules,getRecords(),today());
    if(JSON.stringify(rules)!==JSON.stringify(result.rules)){
      if(result.added)saveRecords(result.records);
      saveRecurring(result.rules);
    }

function renderPie(records,total){
  const container=document.getElementById('chartContainer');
  if(!container)return;
  if(total===0){container.innerHTML='<div style="text-align:center;color:var(--text2);padding:30px">暂无数据</div>';document.getElementById('pieLegend').innerHTML='';return}
  const catSum={};records.forEach(r=>{catSum[r.category]=(catSum[r.category]||0)+r.amount});
  const entries=Object.entries(catSum).sort((a,b)=>b[1]-a[1]);
  const colors=['#4A7C59','#E8A838','#5B8FA8','#C77D7D','#8FAA7F','#B88CB0','#6BA37A','#D4A574','#7C9EB2','#A8A8A8','#D4A574','#B88CB0','#C77D7D'];
  // Build SVG donut chart
  const cx=120,cy=120,r=85,innerR=50;
  let dashOffset=0;
  const totalCirc=2*Math.PI*r;
  let slices='';
  entries.forEach(([cat,amt],i)=>{
    const pct=amt/total;
    const circ=pct*totalCirc;
    const dash=`${circ} ${totalCirc-circ}`;
    const rotate=-90+pct*180; // rotate so it starts from top
    slices+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+colors[i%colors.length]+'" stroke-width="'+(r-innerR)+'" stroke-dasharray="'+dash+'" stroke-dashoffset="'+( -dashOffset)+'" transform="rotate(-90 '+cx+' '+cy+')" style="transition:stroke-dashoffset 0.3s"/>';
    dashOffset+=circ;
  });
  const svg='<svg width="240" height="240" viewBox="0 0 240 240"><defs><filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter></defs>'+
    slices+
    '<text x="120" y="112" text-anchor="middle" font-size="22" font-weight="700" fill="var(--text)">¥'+total.toFixed(0)+'</text>'+
    '<text x="120" y="134" text-anchor="middle" font-size="13" fill="var(--text2)">本月支出</text>'+
    '</svg>';
  container.innerHTML=svg;
  // Legend
  const legend=document.getElementById('pieLegend');
  legend.innerHTML=entries.map(([cat,amt],i)=>{
    const pct=(amt/total*100).toFixed(1);
    return '<div class="stats-cat-item" onclick="showCategoryDetail(\''+cat+'\')" style="cursor:pointer;padding:8px 6px;border-radius:8px;transition:background 0.15s" onmouseover="this.style.background=\'var(--border)\'" onmouseout="this.style.background=\'transparent\'"><span style="width:12px;height:12px;border-radius:3px;background:'+colors[i%colors.length]+';flex-shrink:0"></span><span style="flex:1;font-size:15px;font-weight:500">'+cat+'</span><span style="font-size:14px;color:var(--text2);width:45px;text-align:right">'+pct+'%</span><span style="font-weight:600;font-size:15px;width:70px;text-align:right">¥'+amt.toFixed(2)+'</span></div>';
  }).join('');
}

function renderLine(records,month){
  const container=document.getElementById('lineContainer');
  if(!container)return;
  // Always show last 7 days (including zero-expense days)
  const todayStr=today();
  const [ty,tm,td]=todayStr.split('-').map(Number);
  const d=new Date(ty,tm-1,td);
  const allDays=[];const dayMap={};
  for(let i=6;i>=0;i--){const cd=new Date(d);cd.setDate(cd.getDate()-i);const s=toDateStr(cd);allDays.push(s);dayMap[s]=0}
  const recs=records.filter(r=>r.date.startsWith(month)&&r.type==='expense');
  recs.forEach(r=>{if(dayMap[r.date]!==undefined)dayMap[r.date]+=r.amount});
  const days=allDays;const vals=days.map(d=>dayMap[d]);
  if(recs.length===0){container.innerHTML='<div style="text-align:center;color:var(--text2);padding:30px">暂无数据</div>';return}
  
  const max=Math.max(...vals,1);
  const w=container.clientWidth||360,h=200;
  const pad={t:20,b:40,l:55,r:20};
  const cw=w-pad.l-pad.r,ch=h-pad.t-pad.b;
  const xScale=(i)=>pad.l+cw*(i/(Math.max(days.length-1,1)));
  const yScale=(v)=>pad.t+ch*(1-v/max);
  let pts='',area='',dots='',labels='',grid='';
  // Grid + Y axis
  for(let i=0;i<=4;i++){
    const y=yScale(max*i/4);
    grid+='<line x1="'+pad.l+'" y1="'+y+'" x2="'+(w-pad.r)+'" y2="'+y+'" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="4,4"/>';
    grid+='<text x="'+(pad.l-6)+'" y="'+y+'" text-anchor="end" dominant-baseline="middle" fill="var(--text2)" font-size="11">¥'+(max*(1-i/4)).toFixed(0)+'</text>';
  }
  if(days.length>=2){
    const p=days.map((d,i)=>xScale(i)+','+yScale(vals[i])).join(' ');
    pts='<polyline points="'+p+'" fill="none" stroke="#4A7C59" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#ls)"/>';
    const a='M'+xScale(0)+','+(pad.t+ch)+' '+days.map((d,i)=>xScale(i)+','+yScale(vals[i])).join(' ')+' L'+xScale(days.length-1)+','+(pad.t+ch)+' Z';
    area='<path d="'+a+'" fill="url(#lg)" opacity="0.5"/>';
  }
  days.forEach((d,i)=>{
    const x=xScale(i),y=yScale(vals[i]);
    dots+='<circle cx="'+x+'" cy="'+y+'" r="4" fill="#fff" stroke="#4A7C59" stroke-width="2.5"/>';
    if(days.length<=10||i%Math.ceil(days.length/5)===0||i===days.length-1){
      labels+='<text x="'+x+'" y="'+(pad.t+ch+14)+'" text-anchor="middle" fill="var(--text2)" font-size="11">'+(d.slice(5))+'</text>';
      labels+='<text x="'+x+'" y="'+(y-10)+'" text-anchor="middle" fill="var(--text)" font-size="11" font-weight="600">¥'+vals[i].toFixed(0)+'</text>';
    }
  });
  const svg='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="display:block;background:var(--card)"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4A7C59" stop-opacity="0.15"/><stop offset="100%" stop-color="#4A7C59" stop-opacity="0.01"/></linearGradient><filter id="ls"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#4A7C59" flood-opacity="0.3"/></filter></defs>'+grid+area+pts+dots+labels+'</svg>';
  container.innerHTML=svg;
}function csvCell(v){
  const s=String(v??'');
  return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function downloadFile(filename,content,type){

}

function chooseCSVImport(){document.getElementById('csvImportFile').click()}
function parseCSV(text){
  const rows=[];let row=[],cell='',inQuotes=false;
  text=text.replace(/^\ufeff/,'');
  for(let i=0;i<text.length;i++){
    const ch=text[i],next=text[i+1];
    if(inQuotes&&ch==='"'&&next==='"'){cell+='"';i++;continue}
    if(ch==='"'){inQuotes=!inQuotes;continue}
    if(ch===','&&!inQuotes){row.push(cell);cell='';continue}
    if((ch==='\n'||ch==='\r')&&!inQuotes){
      if(ch==='\r'&&next==='\n')i++;
      row.push(cell);cell='';
      if(row.some(v=>v.trim()!==''))rows.push(row);
      row=[];continue;
    }
    cell+=ch;
  }
  row.push(cell);
  if(row.some(v=>v.trim()!==''))rows.push(row);
  return rows;
}
function normalizeImportKey(r){
  return [r.date||'',r.name||'',r.category||'',r.account||'',Number(r.amount||0).toFixed(2),r.time||''].join('|');
}
function importCSVFile(event){
  const file=event.target.files[0];event.target.value='';
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    const rows=parseCSV(String(reader.result||''));
    if(rows.length<2){alert('CSV 没有可导入的数据');return}
    const header=rows[0].map(h=>h.trim());
    const idx={
      date:header.indexOf('日期'),
      name:header.indexOf('名称'),
      category:header.indexOf('分类'),
      account:header.indexOf('账户'),
      amount:header.indexOf('金额'),
      time:header.indexOf('时间')
    };
    if(idx.date<0||idx.name<0||idx.category<0||idx.amount<0){alert('CSV 表头不匹配，请使用应用导出的格式');return}
    const records=getRecords();
    const existing=new Set(records.map(normalizeImportKey));
    const cats=getCategories(),accts=getAccounts();
    let added=0,skipped=0,invalid=0;
    rows.slice(1).forEach(row=>{
      const amount=parseFloat(row[idx.amount]);
      const date=(row[idx.date]||'').trim();
      const name=(row[idx.name]||'').trim();
      const category=(row[idx.category]||'').trim();
      const account=idx.account>-1?(row[idx.account]||'').trim():'';
      const time=idx.time>-1?(row[idx.time]||'').trim():'';
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!name||!category||!amount||amount<=0){invalid++;return}
      const rec={id:genId(),date,name,category,account,amount,time:time||now(),note:'',type:'expense'};
      const key=normalizeImportKey(rec);
      if(existing.has(key)){skipped++;return}
      records.unshift(rec);existing.add(key);added++;
      if(!cats.includes(category))cats.push(category);
      if(account&&!accts.includes(account))accts.push(account);
    });
    saveRecords(records);
    saveCategories(cats);
    saveAccounts(accts);
    populateCategorySelects();refreshHome();renderBackupStatus();
    alert('导入完成：新增 '+added+' 条，跳过重复 '+skipped+' 条，无效 '+invalid+' 条');
  };
  reader.readAsText(file,'utf-8');
}

  return {
    version:2,
    exportedAt:new Date().toISOString(),
    records:getRecords(),
    categories:getCategories(),
    accounts:getAccounts(),
    shortcuts:getShortcuts(),
    recurring:getRecurring(),
    frequentTemplates:getFrequentTemplates(),
    theme:getTheme()
  };

function restoreBackupJSON(event){
  const file=event.target.files[0];event.target.value='';
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    let data;
    try{data=JSON.parse(String(reader.result||''))}
    catch(e){alert('JSON 备份文件无法解析');return}
    if(!Array.isArray(data.records)){alert('备份文件缺少账单数据');return}
    if(data.recurring!==undefined&&(!Array.isArray(data.recurring)||!data.recurring.every(BillTools.validRule)||new Set(data.recurring.map(r=>r.id)).size!==data.recurring.length)){
      alert('备份中的固定账单无效，未恢复任何数据');return;
    }
    if(data.frequentTemplates!==undefined&&(!Array.isArray(data.frequentTemplates)||!data.frequentTemplates.every(r=>
      r&&typeof r.name==='string'&&r.name.trim()&&typeof r.category==='string'&&r.category.trim()&&typeof r.account==='string'&&
      Number.isFinite(r.amount)&&r.amount>0&&Number.isInteger(r.count)&&r.count>=1&&typeof r.last==='string'))){
      alert('备份中的常用项目无效，未恢复任何数据');return;
    }
    showConfirm('确定用这个 JSON 备份恢复？当前本地数据会被替换。',()=>{
      saveRecords(data.records);
      saveCategories(Array.isArray(data.categories)?data.categories:DEFAULT_CATS);
      saveAccounts(Array.isArray(data.accounts)?data.accounts:DEFAULT_ACCOUNTS);
      saveShortcuts(Array.isArray(data.shortcuts)?data.shortcuts:[]);
      saveRecurring(data.recurring||[]);
      localStorage.setItem(STORAGE_FREQUENT,JSON.stringify(data.frequentTemplates||[]));
      if(data.theme)applyTheme(data.theme);
      populateCategorySelects();refreshHome();renderList();renderBackupStatus();
      alert('JSON 备份已恢复');
    });
  };
  reader.readAsText(file,'utf-8');
}

  const records=getRecords();
  if(records.length===0){alert('没有数据');return}
  const sorted=records.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.time||'').localeCompare(b.time||''));
  let md='---\nsource: bill-pwa\nexported: '+new Date().toISOString()+'\ntarget: Projects/账单/流水\n---\n\n';
  md+='# Bill PWA Obsidian 同步导出\n\n';
  md+='> 手机 PWA 不能静默写入 Obsidian 文件夹；这份文件用于后续在电脑端拆分/导入到 `Projects/账单/流水`。\n\n';
  md+='| 日期 | 名称 | 金额 | 分类 | 账户 | 时间 | 备注 |\n|---|---:|---:|---|---|---|---|\n';

  });

// ====== ANALYSIS ======
function initAnalysis(){
  populateAnalysisSelects();
  const d=new Date();
  setTimeout(function(){
    document.getElementById('analysisDateStart').value=toDateStr(d);
    document.getElementById('analysisDateEnd').value=toDateStr(d);
    runAnalysis();
  },50);
}
function populateAnalysisSelects(){
  const sel=document.getElementById('analysisCategory');
  sel.innerHTML='<option value="">全部分类</option>';
  getCategories().forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o)});
}
function getDateRange(range){
  const d=new Date();const y=d.getFullYear(),m=d.getMonth(),w=d.getDay();
  const wd=w===0?7:w; // Sunday=7, Monday=1...
  const ranges={
    today:[d,d],
    yesterday:[new Date(y,m,d.getDate()-1),new Date(y,m,d.getDate()-1)],
    week:[new Date(y,m,d.getDate()-wd+1),d],
    lastweek:[new Date(y,m,d.getDate()-wd-6),new Date(y,m,d.getDate()-wd)],
    month:[new Date(y,m,1),d],
    lastmonth:[new Date(y,m-1,1),new Date(y,m,0)]
  };
  return ranges[range]||[d,d];
}
function toDateStr(d){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+dd;
}
function quickAnalysis(range){
  const [s,e]=getDateRange(range);
  document.getElementById('analysisDateStart').value=toDateStr(s);
  document.getElementById('analysisDateEnd').value=toDateStr(e);
  runAnalysis();
}
function runAnalysis(){
  const cat=document.getElementById('analysisCategory').value;
  const ds=document.getElementById('analysisDateStart').value;
  const de=document.getElementById('analysisDateEnd').value;
  if(!ds||!de){alert('请选择日期范围');return}
  let records=getRecords().filter(r=>r.type==='expense'&&r.date>=ds&&r.date<=de);
  if(cat) records=records.filter(r=>r.category===cat);
  records.sort((a,b)=>a.ts-b.ts);
  const total=records.reduce((s,r)=>s+r.amount,0);
  const catSum={};records.forEach(r=>{catSum[r.category]=(catSum[r.category]||0)+r.amount});
  const entries=Object.entries(catSum).sort((a,b)=>b[1]-a[1]);
  const days=Math.max(1,Math.ceil((new Date(de)-new Date(ds))/(86400000))+1);
  let html='';
  html+='<div style="display:flex;gap:8px;margin-bottom:10px">';
  html+='<div class="summary-item" style="flex:1"><div class="num" style="font-size:20px">¥'+total.toFixed(2)+'</div><div class="label" style="font-size:11px">合计</div></div>';
  html+='<div class="summary-item" style="flex:1"><div class="num" style="font-size:20px">'+records.length+'</div><div class="label" style="font-size:11px">笔数</div></div>';
  html+='<div class="summary-item" style="flex:1"><div class="num" style="font-size:20px">¥'+(records.length>0?(total/records.length).toFixed(2):'0.00')+'</div><div class="label" style="font-size:11px">笔均</div></div>';
  html+='</div>';
  if(!cat&&entries.length>1){
    html+='<div style="font-size:14px;font-weight:600;margin-bottom:6px;color:var(--text2)">分类分布</div>';
    entries.forEach(([c,a],i)=>{
      const pct=(a/total*100).toFixed(1);
      html+='<div class="stats-cat-item"><span style="width:10px;height:10px;border-radius:2px;background:var(--primary);flex-shrink:0"></span><span style="flex:1;font-size:14px">'+c+'</span><span style="font-size:13px;color:var(--text2)">'+pct+'%</span><span style="font-weight:600;font-size:14px;width:60px;text-align:right">¥'+a.toFixed(2)+'</span></div>';
    });
  }
  if(records.length>0){
    html+='<div style="font-size:14px;font-weight:600;margin:10px 0 6px;color:var(--text2)">明细</div>';
    records.forEach(r=>{
      html+='<div class="list-item"><div class="info"><div class="name">'+(r.name||r.category)+(r.note?' - '+escHtml(r.note):'')+'</div><div class="meta">'+r.date+' · '+r.category+(r.account?' · '+r.account:'')+'</div></div><div class="amount" style="color:var(--danger);font-size:15px">¥'+r.amount.toFixed(2)+'</div></div>';
    });
  }
  if(records.length===0) html+='<div style="text-align:center;padding:20px;color:var(--text2)">该范围内没有记录</div>';
  document.getElementById('analysisResult').innerHTML=html;
}

function showCategoryDetail(cat){
  const records=getRecords().filter(r=>r.category===cat&&r.type==='expense');
  records.sort((a,b)=>b.ts-a.ts);
  const total=records.reduce((s,r)=>s+r.amount,0);
  let html='<div style="font-size:18px;font-weight:700;margin-bottom:4px">'+cat+'</div>';
  html+='<div style="font-size:14px;color:var(--text2);margin-bottom:12px">共'+records.length+'笔 · 合计¥'+total.toFixed(2)+'</div>';
  records.forEach(r=>{
    html+='<div class="list-item"><div class="info"><div class="name">'+(r.name||'')+'</div><div class="meta">'+r.date+' · '+(r.account||'')+'</div></div><div class="amount" style="color:var(--danger)">¥'+r.amount.toFixed(2)+'</div></div>';
  });
  document.getElementById('detailContent').innerHTML=html;
  document.getElementById('detailModal').classList.add('active');
}
